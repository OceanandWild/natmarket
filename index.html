<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NatMarket</title>
  <style>
    /* =========================
   NatMarket — FULL CSS
   ========================= */

/* Variables */
:root{
  --bg: #0f1220;
  --panel: #141526;
  --muted: #9aa3c7;
  --accent: #0072ff;
  --accent-2: #00c6ff;
  --card: #181a2a;
  --glass: rgba(255,255,255,0.03);
  --radius-lg: 14px;
  --radius-md: 8px;
  --shadow-1: 0 6px 20px rgba(2,6,23,0.6);
  --shadow-2: 0 4px 12px rgba(2,6,23,0.5);
  --success: #28a745;
  --danger: #ff5c5c;
  --max-width: 1100px;
  --text: #e6eef8;
  --muted-2: #6b7280;
}

/* Base */
*{box-sizing:border-box}
html,body{height:100%}
body {
  font-family: "Inter", "Segoe UI", Arial, sans-serif;
  background: linear-gradient(180deg, #0b0d16 0%, var(--bg) 100%);
  color: var(--text);
  margin: 0;
  padding: 28px;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  line-height:1.45;
  display: flex;
  justify-content: center;
}

/* App container (assume #app or body contains centered column) */
#app, main, .app-container {
  width: 100%;
  max-width: var(--max-width);
}

/* Typography */
h1,h2,h3 { margin: 0 0 8px 0; font-weight:700; letter-spacing: -0.02em; color:var(--text) }
h1{font-size:28px}
h2{font-size:20px}
h3{font-size:16px}
p { margin: 0 0 10px 0; color: var(--muted); font-size:14px }

/* Buttons */
button, .btn {
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border: none;
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-weight:600;
  transition: transform .12s ease, box-shadow .12s ease, opacity .12s;
  box-shadow: 0 6px 18px rgba(3,10,40,0.5);
  display:inline-flex;
  align-items:center;
  gap:8px;
}
button:active, .btn:active { transform: translateY(1px) scale(.998) }
button:disabled { opacity: .6; cursor:not-allowed; transform:none }

/* Variants */
.btn-ghost {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.06);
  color: var(--text);
  box-shadow:none;
}
.btn-danger { background: linear-gradient(90deg,#ff6b6b,#ff4a4a) }
.btn-sm { padding:6px 8px; border-radius:8px; font-size:13px }

/* Inputs & textareas */
input, textarea, select {
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border: 1px solid rgba(255,255,255,0.04);
  color: var(--text);
  padding: 10px 12px;
  border-radius: var(--radius-md);
  outline: none;
  transition: box-shadow .12s ease, transform .08s ease, border-color .12s;
  font-size:14px;
}
input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.35) }
input:focus, textarea:focus, select:focus {
  box-shadow: 0 6px 18px rgba(2,100,255,0.12);
  border-color: rgba(0,114,255,0.6);
  transform: translateY(-1px);
}

/* Forms layout */
.form-row { display:flex; gap:12px; align-items:center }
.form-col { flex:1 }
.form-card {
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border-radius: var(--radius-lg);
  padding: 18px;
  box-shadow: var(--shadow-1);
  border: 1px solid rgba(255,255,255,0.03);
}

/* Auth box */
#auth {
  max-width: 460px;
  margin: 18px auto;
}
.auth-wrapper {
  display:block;
}
.auth-wrapper h2 { margin-bottom:12px }
.auth-wrapper input { margin-bottom:8px }

/* Dashboard header */
#dmHeader {
  background: linear-gradient(90deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
  padding: 12px 16px;
  border-radius: 12px;
  align-items:center;
  display:flex;
  justify-content:space-between;
  box-shadow: var(--shadow-2);
  border: 1px solid rgba(255,255,255,0.03);
  margin-bottom: 18px;
}
#dmHeader h2 { font-size:18px }
#dmHeader small { color: var(--muted) }

/* Product form */
#productForm {
  margin-bottom: 18px;
}
#productForm .card, .product-form { padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid rgba(255,255,255,0.03) }
.product-form input, .product-form textarea { margin-bottom: 10px }

/* Grid & products list */
#productsList {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  align-items:start;
}
@media (max-width:1000px){ #productsList { grid-template-columns: repeat(2,1fr) } }
@media (max-width:640px){ #productsList { grid-template-columns: 1fr } }

/* Card */
.card {
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border-radius: 12px;
  padding: 14px;
  box-shadow: var(--shadow-2);
  border: 1px solid rgba(255,255,255,0.03);
  overflow: hidden;
  transition: transform .15s ease, box-shadow .15s ease;
}
.card:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(2,6,23,0.6) }

.card .card-meta { display:flex; gap:12px; align-items:center }
.card img {
  width:100%;
  max-width: 220px;
  border-radius:10px;
  object-fit:cover;
  box-shadow: 0 8px 24px rgba(2,6,23,0.5);
  border: 1px solid rgba(255,255,255,0.03);
}

/* Card content */
.card h3 { font-size:16px; margin-bottom:6px; color:var(--text) }
.card p { color: var(--muted); margin: 8px 0 0 0; font-size:13px }

/* Seller row */
.seller {
  display:flex;
  gap:10px;
  align-items:center;
  margin-top:10px;
  color:var(--muted);
}
.seller .avatar {
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:700;
  box-shadow: 0 6px 18px rgba(2,6,23,0.5);
}

/* Rating stars */
.rating {
  display:inline-flex;
  gap:6px;
  align-items:center;
}
.rating span.star {
  font-size:18px;
  cursor:pointer;
  color: rgba(255,255,255,0.22);
  transition: transform .12s ease, color .12s ease;
}
.rating span.star.active { color: #ffd166; transform: translateY(-2px) scale(1.05) }

/* Tiny utilities */
.kv { font-size:13px; color:var(--muted-2) }
.badge {
  display:inline-block;
  background: rgba(255,255,255,0.03);
  color:var(--muted);
  padding:6px 8px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,0.02)
}

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.modal.show { display:flex; }
.modal .modal-backdrop {
  position:absolute;inset:0;background:linear-gradient(90deg, rgba(0,0,0,0.6), rgba(0,0,0,0.6));
  backdrop-filter: blur(4px);
}
.modal .modal-content {
  position:relative; z-index:2;
  width: 100%;
  max-width:720px;
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 30px 80px rgba(2,6,23,0.7);
  border: 1px solid rgba(255,255,255,0.03);
}

/* Loading overlay */
.loading-overlay {
  position: fixed;
  inset: 0;
  display:none;
  background: rgba(2,6,23,0.6);
  z-index:10000;
  align-items:center;justify-content:center;
}
.loading-overlay.show { display:flex }
.loader {
  width:92px;height:92px;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:12px;
  box-shadow: 0 12px 40px rgba(2,6,23,0.6);
}

/* Forms small helpers */
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px }
@media (max-width:720px) { .form-grid { grid-template-columns:1fr } }
.field-label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px }

/* Scrollbar style */
::-webkit-scrollbar { width:12px; height:12px }
::-webkit-scrollbar-thumb {
  background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
  border-radius:999px; border: 2px solid transparent; background-clip: padding-box;
}
::-webkit-scrollbar-track { background: transparent; }

/* Small screens */
@media (max-width:520px) {
  body { padding:14px }
  #dmHeader { flex-direction:column; align-items:flex-start; gap:10px }
  #productsList { gap:12px }
}

/* Tiny helper classes */
.text-center { text-align:center }
.mt-2 { margin-top:8px }
.mb-2 { margin-bottom:8px }
.hidden { display:none !important }

/* Accessibility */
button:focus, input:focus, textarea:focus { outline: 3px solid rgba(0,114,255,0.12); outline-offset:3px }

/* subtle entrance animation for cards */
@keyframes cardIn { from { opacity:0; transform: translateY(8px) } to { opacity:1; transform:none } }
.card { animation: cardIn .28s cubic-bezier(.2,.9,.2,1) both }

/* small responsive image fallback */
.card img[width] { max-width:100% }

/* end of styles */


  </style>
</head>
<body>
  <div id="auth"></div>
  
  <div id="dashboard" style="display:none;">
    <h1>NatMarket 🛒</h1>
    <div id="productForm"></div>
    <div id="productsList"></div>
  </div>
  <script>
 // ---------- NatMarket - Auth persistente y UI ----------

let currentUser = null;

// Helpers de persistencia
function saveCurrentUser(user) {
  if (!user) {
    localStorage.removeItem('natmarket_current_user');
    return;
  }
  localStorage.setItem('natmarket_current_user', JSON.stringify(user));
}

function loadCurrentUser() {
  const raw = localStorage.getItem('natmarket_current_user');
  if (!raw) return null;
  try {
    return JSON.parse(raw);
  } catch (e) {
    console.warn('Error parseando current user', e);
    localStorage.removeItem('natmarket_current_user');
    return null;
  }
}

function logout() {
  currentUser = null;
  saveCurrentUser(null);
  renderAuthUI();
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('auth').style.display = 'block';
  alert('Cerraste sesión. Nos vemos, marinero 🌊');
}

// Inicializa la UI (se ejecuta al cargar)
function init() {
  currentUser = loadCurrentUser();
  if (currentUser && currentUser.id) {
    // sesión restaurada
    document.getElementById('auth').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderDashboardHeader();
    renderProductForm();
    loadProducts();
  } else {
    renderAuthUI();
    document.getElementById('dashboard').style.display = 'none';
  }
}

// Render del bloque de login/registro (sólo cuando no hay sesión)
function renderAuthUI() {
  document.getElementById("auth").innerHTML = `
    <div style="max-width:420px;margin:12px auto;">
      <h2>🔑 Inicia Sesión</h2>
      <input id="loginUser" placeholder="Usuario" style="width:100%;padding:8px;margin:6px 0">
      <input id="loginPass" type="password" placeholder="Contraseña" style="width:100%;padding:8px;margin:6px 0">
      <div style="display:flex;gap:8px">
        <button id="loginBtn" style="flex:1">Entrar</button>
      </div>
      <hr style="margin:12px 0">
      <h3>📌 Registro</h3>
      <input id="regUser" placeholder="Usuario" style="width:100%;padding:8px;margin:6px 0">
      <input id="regPass" type="password" placeholder="Contraseña" style="width:100%;padding:8px;margin:6px 0">
      <div style="display:flex;gap:8px">
        <button id="registerBtn" style="flex:1">Registrar</button>
      </div>
    </div>
  `;

  // listeners
  document.getElementById('loginBtn').onclick = login;
  document.getElementById('registerBtn').onclick = register;
}

// Header dentro del dashboard cuando estás logueado
function renderDashboardHeader() {
  const dashboard = document.getElementById('dashboard');
  // Inserta header si no existe
  if (!document.getElementById('dmHeader')) {
    const header = document.createElement('div');
    header.id = 'dmHeader';
    header.style.display = 'flex';
    header.style.justifyContent = 'space-between';
    header.style.alignItems = 'center';
    header.style.marginBottom = '12px';
    header.innerHTML = `
      <div>
        <button id="btnProfile" style="padding:8px 12px">Perfil</button>
        <h2 style="margin:0">NatMarket 🛒</h2>
        <div style="font-size:0.9rem;color:#ddd">Conectado como <strong id="dmUsername"></strong></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="btnLogout" style="padding:8px 12px">Cerrar sesión</button>
      </div>
    `;
    dashboard.prepend(header);
    document.getElementById('btnLogout').onclick = logout;
  }
  document.getElementById('dmUsername').textContent = currentUser ? currentUser.username : 'desconocido';
  document.getElementById('btnProfile').onclick = renderUserProfile;

}

// Registro
async function register() {
  try {
    const username = document.getElementById('regUser').value.trim();
    const password = document.getElementById('regPass').value;
    if (!username || !password) return alert('Completá usuario y contraseña para registrarte.');
    const res = await fetch("/.netlify/functions/register", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username,password})
    });
    const j = await res.json();
    if (!res.ok) {
      throw new Error(j.error || JSON.stringify(j));
    }
    // guardamos sesión
    currentUser = { id: j.id, username: j.username };
    saveCurrentUser(currentUser);
    document.getElementById('auth').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderDashboardHeader();
    renderProductForm();
    loadProducts();
    alert(`Bienvenido/a ${currentUser.username} — registrado y logueado ✅`);
  } catch (err) {
    console.error('register error', err);
    alert('Error registrando: ' + (err.message || err));
  }
}

// Login
async function login() {
  try {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    if (!username || !password) return alert('Completá usuario y contraseña para entrar.');
    const res = await fetch("/.netlify/functions/login", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username,password})
    });
    const j = await res.json();
    if (!res.ok) {
      throw new Error(j.error || JSON.stringify(j));
    }
    currentUser = { id: j.id, username: j.username };
    saveCurrentUser(currentUser);
    document.getElementById('auth').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderDashboardHeader();
    renderProductForm();
    loadProducts();
    alert(`Bienvenido/a ${currentUser.username} — sesión guardada 🔒`);
  } catch (err) {
    console.error('login error', err);
    alert('Error al iniciar sesión: ' + (err.message || err));
  }
}

// --- UI: tabs filter (Todos / Tus Productos)
function renderTabs() {
  const el = document.createElement('div');
  el.style.display = 'flex';
  el.style.gap = '8px';
  el.style.marginBottom = '12px';
  el.innerHTML = `
    <button id="tabAll" class="btn-sm">Todos</button>
    <button id="tabMine" class="btn-sm btn-ghost">Tus Productos</button>
  `;
  const dashboard = document.getElementById('dashboard');
  // Si ya existe, reemplaza
  const existing = document.getElementById('tabsRow');
  if (existing) existing.remove();
  el.id = 'tabsRow';
  dashboard.insertBefore(el, document.getElementById('productForm'));
  document.getElementById('tabAll').onclick = () => {
    document.getElementById('tabAll').classList.remove('btn-ghost');
    document.getElementById('tabAll').classList.add('btn-sm');
    document.getElementById('tabMine').classList.add('btn-ghost');
    loadProducts('all');
  };
  document.getElementById('tabMine').onclick = () => {
    document.getElementById('tabMine').classList.remove('btn-ghost');
    document.getElementById('tabMine').classList.add('btn-sm');
    document.getElementById('tabAll').classList.add('btn-ghost');
    loadProducts('mine');
  };
}

// --- Render product form: ahora incluye número de contacto (para WhatsApp)
function renderProductForm(){
  document.getElementById("productForm").innerHTML = `
    <div style="max-width:720px;margin:0 auto 18px;">
      <h2>🛒 Publicar Nuevo Producto</h2>
      <input id="pName" placeholder="Nombre" style="width:100%;padding:8px;margin:6px 0">
      <textarea id="pDesc" placeholder="Descripción" style="width:100%;padding:8px;margin:6px 0"></textarea>
      <div class="form-grid">
        <input id="pPrice" type="number" placeholder="Precio" style="padding:8px;margin:6px 0">
        <input id="pPhone" placeholder="Número de contacto (ej: +598XXXXXXXX)" style="padding:8px;margin:6px 0">
      </div>
      <input id="pImage" placeholder="URL Imagen" style="width:100%;padding:8px;margin:6px 0">
      <div style="display:flex;gap:8px">
        <button id="publishBtn" style="padding:8px 12px">Publicar</button>
      </div>
    </div>
  `;
  document.getElementById('publishBtn').onclick = publishProduct;
}

// --- Publicar producto (ahora envía contact_number)
async function publishProduct(){
  try {
    if (!currentUser) throw new Error('Debés iniciar sesión');
    const product = {
      user_id: currentUser.id,
      name: document.getElementById('pName').value.trim(),
      description: document.getElementById('pDesc').value.trim(),
      price: parseFloat(document.getElementById('pPrice').value) || 0,
      image_url: document.getElementById('pImage').value.trim(),
      contact_number: document.getElementById('pPhone').value.trim() || null
    };

    if (!product.name) return alert('El producto necesita un nombre.');

    const res = await fetch("/.netlify/functions/products", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(product)
    });

    if (!res.ok) {
      let errTxt;
      try { const j = await res.json(); errTxt = j.error || JSON.stringify(j); }
      catch { errTxt = await res.text(); }
      throw new Error(`Server ${res.status}: ${errTxt}`);
    }

    const data = await res.json();
    console.log('Publicado:', data);
    alert('Producto publicado ✅');
    // limpiar form
    document.getElementById('pName').value = '';
    document.getElementById('pDesc').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pPhone').value = '';
    document.getElementById('pImage').value = '';
    await loadProducts();
  } catch (err) {
    console.error('publishProduct error:', err);
    alert('Error al publicar: ' + (err.message || err));
  }
}

/* -------------------------
  Helper seguro para leer response
   - lee texto 1 vez
   - intenta parsear JSON si puede
   - devuelve { ok, status, raw, json }
------------------------- */
async function readResponse(res) {
  const raw = await res.text(); // leer UNA sola vez
  let json = null;
  try {
    json = raw ? JSON.parse(raw) : null;
  } catch (e) {
    // no es JSON, lo ignoramos (json queda null)
  }
  return {
    ok: res.ok,
    status: res.status,
    raw,
    json
  };
}

/* -------------------------
  deleteProduct (reemplaza)
------------------------- */
async function deleteProduct(productId) {
  try {
    if (!currentUser) throw new Error('Debés iniciar sesión');
    if (!confirm('¿Eliminar este producto? Esta acción no se puede deshacer.')) return;

    const res = await fetch(`/.netlify/functions/products/${productId}`, {
      method: 'DELETE',
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: currentUser.id })
    });

    const { ok, status, raw, json } = await readResponse(res);

    if (!ok) {
      const errTxt = (json && (json.error || JSON.stringify(json))) || raw || `HTTP ${status}`;
      throw new Error(errTxt);
    }

    // éxito
    const deleted = json || (raw ? raw : { success: true });
    console.log('Eliminado:', deleted);
    alert('Producto eliminado ✅');
    await loadProducts();
  } catch (err) {
    console.error('deleteProduct error:', err);
    alert('No se pudo eliminar: ' + (err.message || err));
  }
}

/* -------------------------
  publishProduct (reemplaza)
------------------------- */
async function publishProduct(){
  try {
    if (!currentUser) throw new Error('Debés iniciar sesión');
    const product = {
      user_id: currentUser.id,
      name: document.getElementById('pName').value.trim(),
      description: document.getElementById('pDesc').value.trim(),
      price: parseFloat(document.getElementById('pPrice').value) || 0,
      image_url: document.getElementById('pImage').value.trim(),
      contact_number: document.getElementById('pPhone') ? document.getElementById('pPhone').value.trim() : null
    };

    if (!product.name) return alert('El producto necesita un nombre.');

    const res = await fetch("/.netlify/functions/products", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(product)
    });

    const { ok, status, raw, json } = await readResponse(res);

    if (!ok) {
      const errTxt = (json && (json.error || JSON.stringify(json))) || raw || `HTTP ${status}`;
      throw new Error(errTxt);
    }

    const data = json || {};
    console.log('Publicado:', data);
    alert('Producto publicado ✅');

    // limpiar form
    if (document.getElementById('pName')) document.getElementById('pName').value = '';
    if (document.getElementById('pDesc')) document.getElementById('pDesc').value = '';
    if (document.getElementById('pPrice')) document.getElementById('pPrice').value = '';
    if (document.getElementById('pPhone')) document.getElementById('pPhone').value = '';
    if (document.getElementById('pImage')) document.getElementById('pImage').value = '';

    await loadProducts();
  } catch (err) {
    console.error('publishProduct error:', err);
    alert('Error al publicar: ' + (err.message || err));
  }
}

/* -------------------------
  loadProducts (reemplaza)
------------------------- */
async function loadProducts(mode = 'all'){
  try {
    const res = await fetch("/.netlify/functions/products");
    const { ok, status, raw, json } = await readResponse(res);

    if (!ok) {
      const errTxt = (json && (json.error || JSON.stringify(json))) || raw || `HTTP ${status}`;
      throw new Error(errTxt);
    }

    let products = json || [];
    // (mantener lógica de ordenamiento/filtrado que ya tenías)
    if (mode === 'mine' && currentUser && currentUser.id) {
      products = products.filter(p => Number(p.user_id) === Number(currentUser.id));
    } else if (mode === 'all' && currentUser && currentUser.id) {
      products.sort((a,b) => {
        if (Number(a.user_id) === Number(currentUser.id) && Number(b.user_id) !== Number(currentUser.id)) return -1;
        if (Number(b.user_id) === Number(currentUser.id) && Number(a.user_id) !== Number(currentUser.id)) return 1;
        return new Date(b.created_at) - new Date(a.created_at);
      });
    } else {
      products.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    }

    // render (puedes dejar tu markup)
const list = products.map(p => {
  const isOwner = currentUser && Number(p.user_id) === Number(currentUser.id);
  const phone = p.contact_number || '';
  const sanitized = phone ? phone.replace(/[^+\d]/g,'') : '';
  const message = encodeURIComponent(`Hola, vi tu producto "${p.name}" en NatMarket. ¿Sigue disponible?`);
  const waLink = sanitized ? `https://wa.me/${sanitized.replace(/^\+/, '')}?text=${message}` : null;

  return `
  <div class="card" style="padding:12px;border-radius:8px;background:#111;color:#fff;margin-bottom:12px">
    <h3 style="margin:0 0 6px">${escapeHtml(p.name)} - $${p.price ?? 0}</h3>
    <div style="display:flex;gap:12px;align-items:flex-start">
      <img src="${p.image_url || 'https://placehold.co/400x300'}" width="120" style="border-radius:8px;object-fit:cover">
      <div style="flex:1">
        <p style="margin:0 0 8px">${escapeHtml(p.description || '')}</p>
        <small>Vendedor: <strong>${escapeHtml(p.username || '—')}</strong> ⭐${p.avg_rating ?? 0}</small>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
          ${ waLink ? `<a class="btn-sm" href="${waLink}" target="_blank" rel="noopener">📲 Comprar (WhatsApp)</a>` : `<span class="badge">Sin número de contacto</span>` }
          <button class="btn-ghost btn-sm" onclick="openProductChat(${p.id}, '${escapeHtml(p.username)}')">💬 Chat</button>
          ${ isOwner ? `<button class="btn-ghost btn-sm" onclick="deleteProduct(${p.id})">🗑️ Eliminar</button>` : '' }
        </div>
      </div>
    </div>
  </div>
  `;
}).join('');

    document.getElementById("productsList").innerHTML = list || '<p>No hay productos aún.</p>';
  } catch (err) {
    console.error('loadProducts error:', err);
    alert('Error cargando productos: ' + (err.message || err));
  }
}

async function openProductChat(productId, sellerName) {
  if (!currentUser) return alert('Iniciá sesión para chatear.');

  const modalHtml = `
    <div class="modal show" id="chatModal">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2>Chat sobre el producto con ${sellerName}</h2>
        <div id="chatMessages" style="max-height:300px;overflow-y:auto;margin-bottom:12px"></div>
        <input id="chatInput" placeholder="Escribí tu mensaje..." style="width:100%;margin-bottom:6px">
        <div style="display:flex;gap:8px">
          <button id="sendMsgBtn" class="btn">Enviar</button>
          <button id="closeChatBtn" class="btn btn-ghost">Cerrar</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', modalHtml);

  const container = document.getElementById('chatMessages');

  async function loadMessages() {
    const res = await fetch(`/.netlify/functions/messages/${productId}`);
    const msgs = await res.json();
    container.innerHTML = msgs.map(m => `<p><strong>${m.sender_username}:</strong> ${escapeHtml(m.message)}</p>`).join('');
    container.scrollTop = container.scrollHeight;
  }

  document.getElementById('sendMsgBtn').onclick = async () => {
    const text = document.getElementById('chatInput').value.trim();
    if (!text) return;
    await fetch('/.netlify/functions/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ sender_id: currentUser.id, product_id: productId, message: text })
    });
    document.getElementById('chatInput').value = '';
    loadMessages();
  };

  document.getElementById('closeChatBtn').onclick = () => {
    document.getElementById('chatModal').remove();
    clearInterval(interval);
  };

  await loadMessages();
  const interval = setInterval(loadMessages, 3000);
}


// Al iniciar la app, renderizamos tabs también
document.addEventListener('DOMContentLoaded', () => {
  init();
  renderTabs(); // crea los botones Todos / Tus Productos
});


// pequeña función para evitar inyección en la UI
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"'`=\/]/g, s => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'
  })[s]);
}


async function renderUserProfile() {
  if (!currentUser) return alert('No hay usuario logueado.');

  const res = await fetch(`/.netlify/functions/users/${currentUser.id}`);
  const user = await res.json();
  if (!res.ok) throw new Error(user.error || 'Error cargando usuario');

  const modalHtml = `
    <div class="modal show" id="profileModal">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2>Perfil de ${user.username}</h2>
        <p>Usuario: <strong>${user.username}</strong></p>
        <p>Registrado: ${new Date(user.created_at).toLocaleString()}</p>
        <hr>
        <h3>Cambiar contraseña</h3>
        <input id="oldPass" type="password" placeholder="Contraseña actual" style="width:100%;margin-bottom:6px">
        <input id="newPass" type="password" placeholder="Nueva contraseña" style="width:100%;margin-bottom:6px">
        <div style="display:flex;gap:8px">
          <button id="savePassBtn" class="btn">Guardar</button>
          <button id="closeModalBtn" class="btn btn-ghost">Cerrar</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', modalHtml);

  document.getElementById('closeModalBtn').onclick = () => {
    document.getElementById('profileModal').remove();
  };

  document.getElementById('savePassBtn').onclick = async () => {
    const oldPassword = document.getElementById('oldPass').value;
    const newPassword = document.getElementById('newPass').value;
    if (!oldPassword || !newPassword) return alert('Completá ambos campos');

    try {
      const res = await fetch(`/.netlify/functions/users/${currentUser.id}/password`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ oldPassword, newPassword })
      });
      const j = await res.json();
      if (!res.ok) throw new Error(j.error || 'Error al actualizar contraseña');
      alert(j.message || 'Contraseña cambiada ✅');
      document.getElementById('profileModal').remove();
    } catch (err) {
      alert(err.message || err);
    }
  };
}
